<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nextdoor AI 智能对话交互 (8090 Gateway 直连演练)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      margin-left: 2px;
      animation: pulse-fast 0.8s infinite;
      color: #4f46e5;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 flex items-center justify-center font-sans">
  <div class="flex flex-col h-[780px] w-full max-w-4xl bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
    <!-- 顶部状态栏 -->
    <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span id="gateway-indicator" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
        <div>
          <h2 class="text-sm font-semibold tracking-wide flex items-center gap-2">
            <span>Nextdoor AI 智能对话中枢</span>
            <span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded font-mono">Gateway: :8090</span>
          </h2>
          <p id="gateway-status-text" class="text-[10px] text-slate-400 mt-0.5">正在检测本地 Go 网关状态...</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="handleStartWritingFlow()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
          <span>长文工作流</span>
        </button>
      </div>
    </div>

    <!-- 写作工作流大纲横幅 -->
    <div id="writing-banner" class="hidden bg-indigo-50 border-b border-indigo-100 p-3.5 flex items-center justify-between text-xs text-indigo-900">
      <div>
        <span class="font-bold">📚 创作工作流已锁定:</span> <span id="writing-topic" class="font-medium"></span>
        <span id="writing-outline-count" class="ml-2 text-indigo-600 font-medium"></span>
      </div>
      <button onclick="closeWritingBanner()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
    </div>

    <!-- 聊天内容展示区 -->
    <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50/50">
      <div id="welcome-tip" class="text-center text-slate-400 mt-28 text-xs space-y-1">
        <p class="font-medium text-slate-500">✨ Nextdoor 开放平台能力包接入演示</p>
        <p>输入问题开始对话；短句输入（≤60 字符）将自动触发意图匹配与智能体卡片推荐。</p>
        <p class="text-[11px] text-indigo-500 font-mono mt-2">已绑定中文输入法 IME 防抖，敲拼音选词前严禁发包</p>
      </div>
    </div>

    <!-- 意图推荐卡片栏 -->
    <div id="intent-recommendations" class="hidden px-4 py-2 bg-amber-50 border-t border-amber-200/60 flex items-center gap-2 overflow-x-auto text-[11px]">
      <span class="text-amber-700 font-semibold shrink-0">🎯 意图推荐:</span>
      <div id="intent-card-list" class="flex items-center gap-2"></div>
    </div>

    <!-- 底部输入框 -->
    <div class="p-4 bg-white border-t border-slate-200 space-y-2">
      <div id="image-preview-bar" class="hidden flex items-center gap-2 text-xs text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-200">
        <span>📷 已关联图片:</span>
        <span id="image-preview-url" class="truncate max-w-xs text-[11px] font-mono"></span>
        <button onclick="clearVisionImage()" class="text-indigo-400 hover:text-indigo-600 ml-auto">✕</button>
      </div>

      <div class="flex items-center gap-2">
        <input
          id="vision-url-input"
          type="text"
          placeholder="可选填图片 URL"
          class="w-36 px-3 py-2 border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-indigo-400"
          onchange="updateVisionImage(this.value)"
        >

        <input
          id="user-input"
          type="text"
          placeholder="输入您的问题 (≤60 字符推演意图，按回车发送)..."
          class="flex-1 px-3.5 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        >

        <button
          id="btn-send"
          onclick="handleSendMessage()"
          class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow transition flex items-center gap-1.5"
        >
          <i data-lucide="send" class="w-3.5 h-3.5"></i>
          <span>发送</span>
        </button>

        <button
          id="btn-stop"
          onclick="handleStopStream()"
          class="hidden px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg text-xs font-semibold shadow transition flex items-center gap-1.5"
        >
          <i data-lucide="square" class="w-3.5 h-3.5"></i>
          <span>停止</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const GATEWAY_URL = 'http://127.0.0.1:8090';
    let currentSessionId = 'sess_' + Date.now(); // 强制 string
    let isStreaming = false;
    let abortController = null;
    let isComposing = false;
    let debounceTimer = null;
    let messages = [];

    // 1. 初始化检测网关健康状态
    async function checkGatewayHealth() {
      const indicator = document.getElementById('gateway-indicator');
      const statusText = document.getElementById('gateway-status-text');
      try {
        const res = await fetch(`${GATEWAY_URL}/healthz`);
        const data = await res.json();
        if (data.code === 0) {
          indicator.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400';
          statusText.innerText = `网关已就绪 (Upstream: ${data.data.upstream_base})`;
        } else {
          indicator.className = 'w-2.5 h-2.5 rounded-full bg-amber-400';
          statusText.innerText = '网关响应异常';
        }
      } catch (err) {
        indicator.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
        statusText.innerText = '本地网关未启动 (请先运行 go run gateway/main.go)';
      }
    }
    checkGatewayHealth();

    // 2. 输入框 IME 中文输入法监听
    const inputElem = document.getElementById('user-input');
    inputElem.addEventListener('compositionstart', () => { isComposing = true; });
    inputElem.addEventListener('compositionend', (e) => {
      isComposing = false;
      triggerIntentCheck(e.target.value);
    });
    inputElem.addEventListener('input', (e) => {
      triggerIntentCheck(e.target.value);
    });
    inputElem.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !isComposing) {
        handleSendMessage();
      }
    });

    // 3. 意图防抖匹配 (Unicode 码点统计)
    function triggerIntentCheck(text) {
      if (debounceTimer) clearTimeout(debounceTimer);
      if (isComposing) return;

      const trimmed = text.trim();
      const runeCount = Array.from(trimmed).length;
      if (runeCount === 0 || runeCount > 60) {
        hideIntentCards();
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`${GATEWAY_URL}/api/chat/intent/match`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: trimmed, session_id: currentSessionId })
          });
          const json = await res.json();
          if (json.code === 0 && json.data && json.data.matched) {
            renderIntentCards(json.data);
          } else {
            hideIntentCards();
          }
        } catch (err) {
          hideIntentCards();
        }
      }, 300);
    }

    function renderIntentCards(data) {
      const container = document.getElementById('intent-recommendations');
      const list = document.getElementById('intent-card-list');
      list.innerHTML = '';

      if (data.candidate_agents) {
        data.candidate_agents.forEach(ag => {
          const btn = document.createElement('button');
          btn.className = 'px-2.5 py-1 bg-white border border-amber-300 rounded-md text-amber-900 font-medium hover:bg-amber-100 shadow-sm transition shrink-0';
          btn.innerText = `🤖 ${ag.name} (${ag.matched_score}%)`;
          btn.onclick = () => {
            inputElem.value = `[指定智能体: ${ag.name}] ` + inputElem.value;
            hideIntentCards();
          };
          list.appendChild(btn);
        });
      }

      if (data.tool_cards) {
        data.tool_cards.forEach(tl => {
          const span = document.createElement('span');
          span.className = 'px-2 py-0.5 bg-amber-200/50 text-amber-800 rounded font-mono text-[10px] shrink-0';
          span.innerText = `🔧 ${tl.name}`;
          list.appendChild(span);
        });
      }

      container.classList.remove('hidden');
    }

    function hideIntentCards() {
      document.getElementById('intent-recommendations').classList.add('hidden');
    }

    // 4. 发送消息与流式处理
    async function handleSendMessage() {
      const text = inputElem.value.trim();
      const visionUrl = document.getElementById('vision-url-input').value.trim();
      if (!text || isStreaming) return;

      document.getElementById('welcome-tip')?.remove();
      hideIntentCards();

      const userMsg = { role: 'user', content: text, vision_image_url: visionUrl || null };
      messages.push(userMsg);
      appendMessageUI(userMsg);

      inputElem.value = '';
      clearVisionImage();

      // UI 切换为生成态
      isStreaming = true;
      document.getElementById('btn-send').classList.add('hidden');
      document.getElementById('btn-stop').classList.remove('hidden');

      const assistantMsgElem = appendMessageUI({ role: 'assistant', content: '' });
      assistantMsgElem.classList.add('typing-cursor');

      abortController = new AbortController();

      try {
        const response = await fetch(`${GATEWAY_URL}/api/chat/stream`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
          body: JSON.stringify({
            messages: messages,
            session_id: currentSessionId,
            persona: '你是一位精通生成式搜索优化与商业分析的资深助手'
          }),
          signal: abortController.signal
        });

        if (!response.ok) {
          const errData = await response.json();
          assistantMsgElem.innerText = `❌ 请求异常: ${errData.msg || response.statusText}`;
          assistantMsgElem.classList.remove('typing-cursor');
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let fullContent = '';
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith(':')) continue;

            if (trimmed.startsWith('data:')) {
              const rawData = trimmed.slice(5).trim();
              if (rawData === '[DONE]') break;

              try {
                if (rawData.startsWith('{') && rawData.endsWith('}')) {
                  const parsed = JSON.parse(rawData);
                  if (parsed.event === 'error') {
                    fullContent += `\n[网络中断: ${parsed.msg}]`;
                    continue;
                  }
                  fullContent += (parsed.delta || parsed.content || '');
                } else {
                  fullContent += rawData;
                }
              } catch {
                fullContent += rawData;
              }

              assistantMsgElem.innerText = fullContent;
              scrollChatToBottom();
            }
          }
        }

        messages.push({ role: 'assistant', content: fullContent });
      } catch (err) {
        if (err.name !== 'AbortError') {
          assistantMsgElem.innerText += `\n[异常: ${err.message}]`;
        }
      } finally {
        assistantMsgElem.classList.remove('typing-cursor');
        isStreaming = false;
        document.getElementById('btn-send').classList.remove('hidden');
        document.getElementById('btn-stop').classList.add('hidden');
      }
    }

    function handleStopStream() {
      if (abortController) abortController.abort();
    }

    function appendMessageUI(msg) {
      const container = document.getElementById('chat-messages');
      const wrap = document.createElement('div');
      wrap.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`;

      const box = document.createElement('div');
      box.className = `max-w-[78%] rounded-2xl px-4 py-3 text-xs leading-relaxed shadow-sm ${
        msg.role === 'user'
          ? 'bg-indigo-600 text-white rounded-br-none'
          : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'
      }`;

      if (msg.vision_image_url) {
        const img = document.createElement('img');
        img.src = msg.vision_image_url;
        img.className = 'rounded-lg mb-2 max-h-48 object-cover border border-indigo-100';
        box.appendChild(img);
      }

      const textNode = document.createElement('div');
      textNode.className = 'whitespace-pre-wrap';
      textNode.innerText = msg.content;
      box.appendChild(textNode);

      wrap.appendChild(box);
      container.appendChild(wrap);
      scrollChatToBottom();
      return textNode;
    }

    function scrollChatToBottom() {
      const container = document.getElementById('chat-messages');
      container.scrollTop = container.scrollHeight;
    }

    function updateVisionImage(url) {
      if (!url.trim()) { clearVisionImage(); return; }
      document.getElementById('image-preview-url').innerText = url;
      document.getElementById('image-preview-bar').classList.remove('hidden');
    }

    function clearVisionImage() {
      document.getElementById('vision-url-input').value = '';
      document.getElementById('image-preview-bar').classList.add('hidden');
    }

    // 5. 长文创作流
    async function handleStartWritingFlow() {
      try {
        const res = await fetch(`${GATEWAY_URL}/api/writing/sessions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            topic: '2026徐州企业大模型搜索获客实战指南',
            genre: '深度商业案例白皮书',
            target_words: 3000
          })
        });
        const json = await res.json();
        if (json.code === 0 && json.data) {
          document.getElementById('writing-topic').innerText = json.data.topic;
          document.getElementById('writing-outline-count').innerText = `已生成 ${json.data.outline?.length || 0} 级大纲`;
          document.getElementById('writing-banner').classList.remove('hidden');
        } else {
          alert(`开启创作流失败: ${json.msg}`);
        }
      } catch (err) {
        alert(`网络异常: ${err.message}`);
      }
    }

    function closeWritingBanner() {
      document.getElementById('writing-banner').classList.add('hidden');
    }

    lucide.createIcons();
  </script>
</body>
</html>
