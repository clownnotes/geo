<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEO 交付管理端 - 登录</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      background: #7c5bf5;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 20px;
      box-shadow: 0 8px 16px -4px rgba(124, 91, 245, 0.4);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .security-badge {
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .security-badge strong {
      color: #78350f;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus {
      background: #fff;
      border-color: #7c5bf5;
      box-shadow: 0 0 0 3px rgba(124, 91, 245, 0.15);
    }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 18px;
      display: none;
    }
    .btn-submit {
      width: 100%;
      padding: 12px 16px;
      background: #7c5bf5;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(124, 91, 245, 0.35);
      transition: background 0.2s, transform 0.1s;
    }
    .btn-submit:hover {
      background: #6846e3;
    }
    .btn-submit:active {
      transform: scale(0.99);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .divider {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
    }
    .divider-text {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 12px;
    }
    .btn-qr {
      width: 100%;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-qr:hover {
      background: #f8fafc;
    }
    .qr-box {
      margin-top: 16px;
      text-align: center;
      display: none;
    }
    .qr-img {
      width: 160px;
      height: 160px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background: #fff;
      margin: 0 auto 8px;
      object-fit: contain;
    }
    .qr-hint {
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-header">
      <div class="brand-logo">G</div>
      <div>
        <h1 class="brand-title">GEO 交付管理端</h1>
        <p class="brand-sub">GENERATIVE ENGINE OPTIMIZATION</p>
      </div>
    </div>

    <div class="security-badge">
      <strong>纯内部专有系统</strong>：不对外开放公开注册。请使用小毛驴统一账号登录。
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="login-username">手机号</label>
        <input id="login-username" class="form-input" type="text" required placeholder="小毛驴账号手机号" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">登录密码</label>
        <input id="login-password" class="form-input" type="password" required placeholder="小毛驴登录密码" autocomplete="current-password">
      </div>

      <div id="login-error" class="error-box"></div>

      <button id="btn-submit" type="submit" class="btn-submit">登录工作台</button>
    </form>

    <div class="divider">
      <p class="divider-text">或使用微信扫码（小毛驴统一账号）</p>
      <button type="button" id="btn-load-qr" class="btn-qr" onclick="loadWechatLoginQr()">显示微信登录码</button>
      <div id="wechat-qr-box" class="qr-box">
        <img id="wechat-qr-img" class="qr-img" alt="微信登录二维码">
        <p id="wechat-qr-hint" class="qr-hint">用微信扫一扫完成登录；成功后刷新本页。</p>
      </div>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('login-username').value.trim();
      const pwd = document.getElementById('login-password').value;
      const errBox = document.getElementById('login-error');
      const submitBtn = document.getElementById('btn-submit');

      errBox.style.display = 'none';
      errBox.innerText = '';
      submitBtn.disabled = true;
      submitBtn.innerText = '正在验证...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: user, username: user, password: pwd })
        });
        const data = await res.json();
        if (data.success || data.code === 0) {
          const token = data.token || (data.data && data.data.token) || '';
          if (token) {
            localStorage.setItem('geo_token', token);
          }
          sessionStorage.removeItem('geo_manual_logout');
          submitBtn.innerText = '登录成功，正在进入...';
          // 刷新页面，此时带上服务端种植的 Cookie: geo_token，总门放行下发工作台
          window.location.href = '/';
        } else {
          document.getElementById('login-password').value = '';
          errBox.innerText = data.message || data.msg || '账号或密码错误！';
          errBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerText = '登录工作台';
        }
      } catch (err) {
        document.getElementById('login-password').value = '';
        errBox.innerText = '网络连接异常，请检查服务状态。';
        errBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = '登录工作台';
      }
    }

    async function loadWechatLoginQr() {
      const box = document.getElementById('wechat-qr-box');
      const img = document.getElementById('wechat-qr-img');
      const hint = document.getElementById('wechat-qr-hint');
      const btn = document.getElementById('btn-load-qr');

      btn.disabled = true;
      btn.innerText = '正在生成二维码...';

      try {
        const res = await fetch('/api/auth/wechat-qr');
        const data = await res.json();
        if (data.code === 0 && data.data) {
          const url = data.data.qr_url || data.data.url || '';
          if (url) {
            img.src = url;
            box.style.display = 'block';
            btn.style.display = 'none';
            if (hint) hint.innerText = '用微信扫一扫完成登录；成功后点击刷新。';
            return;
          }
        }
        alert(data.msg || data.message || '暂时拿不到微信登录码');
        btn.disabled = false;
        btn.innerText = '显示微信登录码';
      } catch (e) {
        alert('微信登录码请求失败');
        btn.disabled = false;
        btn.innerText = '显示微信登录码';
      }
    }
  </script>
</body>
</html>
