  <!-- 底部微标 -->
  <text x="500" y="580" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">
    📐 普林斯顿大学 GEO 论文框架实现 · 标准企业架构蓝图
