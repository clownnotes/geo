# GEO 商业交付与 SOP 流水线管理系统 - Nginx 反向代理配置
# 放置路径: /etc/nginx/conf.d/geo.conf 或 /etc/nginx/sites-available/geo.conf

server {
    listen 80;
    server_name geo.baicl.cc; # 替换为您在腾讯云解析的实际域名

    # 强制跳转 HTTPS（建议在申请好 SSL 证书后开启）
    # return 301 https://$host$request_uri;

    # 客户端上传与导出大小限制（支持大文件与全套成果 ZIP 下载）
    client_max_body_size 100m;

    # Gzip 静态压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. [已下线 2026-11-23] 旧 8088 管理台已退役，统一切换至小毛驴 :3002 与 :18092
    # 反向代理 location 下线保留配置注释，严禁整块删除导致域名配置失效
    # location / {
    #     proxy_pass http://127.0.0.1:8088;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_connect_timeout 60s;
    #     proxy_read_timeout 120s;
    #     proxy_send_timeout 120s;
    #     proxy_buffering off;
    # }

    # 多租户兼容路径: /sites/{project_id}/ 缺尾斜杠强制 301 永久重定向
    location ~* ^/sites/([^/]+)$ {
        return 301 /sites/$1/;
    }

    # 2. [已下线 2026-11-23] 旧公共文档代理下线
    # location ~* ^/(llms\.txt|robots\.txt|docs/) {
    #     proxy_pass http://127.0.0.1:8088;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     expires 1h;
    #     add_header Cache-Control "public, no-transform";
    # }
}

