# GEO 商业交付与 SOP 流水线管理系统 - Nginx 反向代理配置
# 放置路径: /etc/nginx/conf.d/geo.conf 或 /etc/nginx/sites-available/geo.conf

server {
    listen 80;
    server_name geo.baicl.cc; # 替换为您在腾讯云解析的实际域名

    # 强制跳转 HTTPS（建议在申请好 SSL 证书后开启）
    # return 301 https://$host$request_uri;

    # 客户端上传与导出大小限制（支持大文件与全套成果 ZIP 下载）
    client_max_body_size 100m;

    # Gzip 静态压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. 核心代理转发到本地 Python Web 服务
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        # 传递真实客户端 IP 与 Host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（流水线生成可能需要若干秒，避免 504 错误）
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 缓冲设置
        proxy_buffering off;
    }

    # 2. 公共文档与大模型爬虫入口（放行缓存，加速 Bytespider 等 AI 爬虫抓取）
    location ~* ^/(llms\.txt|robots\.txt|docs/) {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}

