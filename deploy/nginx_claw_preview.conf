# GEO SaaS 客户官网预览网关配置 (claw.baicl.cc)
# 放置路径参考: /etc/nginx/conf.d/claw_preview.conf
# 核心机制: 基于 projects/{project_id}/outputs/site/.published 无状态哨兵文件控制公网可见性

server {
    listen 80;
    server_name claw.baicl.cc;

    # 生产环境配置好 SSL 证书后启用 HTTPS 强制跳转
    # return 301 https://$host$request_uri;

    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/json application/ld+json application/javascript text/xml application/xml image/svg+xml;

    # 1. 网关根路径禁止目录遍历与默认展示
    location = / {
        return 404;
    }

    # 2. 网关根级 robots.txt 屏蔽全站根域收录（客户子目录内 outputs/site/robots.txt 保持 AI 爬虫放行以支持无缝迁入正式域名）
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 3. 最高优先级拦截一切隐藏点文件与点目录（严防 /{project_id}/.published、/.env、/.git 泄露）
    location ~ /\. {
        return 404;
    }

    # 4. 客户预览路径缺少末尾斜杠时强制 301 永久重定向（确保站内相对路径 CSS / 图片 / llms.txt 不错位 404）
    # 首字符强制 [a-zA-Z0-9]，自动排除 _template 等保留目录前缀
    location ~ ^/([a-zA-Z0-9][a-zA-Z0-9_-]*)$ {
        return 301 /$1/;
    }

    # 5. 客户静态站点挂载（root + rewrite ... break + try_files，彻底规避 alias + try_files 拼接缺陷）
    location ~ ^/([a-zA-Z0-9][a-zA-Z0-9_-]*)/(.*)$ {
        if (!-f /Users/ne/apps/GEO/projects/$1/outputs/site/.published) {
            return 404;
        }

        root /Users/ne/apps/GEO/projects;
        add_header Cache-Control "no-cache";
        rewrite ^/([a-zA-Z0-9][a-zA-Z0-9_-]*)/(.*)$ /$1/outputs/site/$2 break;
        try_files $uri $uri/index.html =404;
    }

    # 6. 其余未匹配路径（如 _template/ 等保留前缀）一律返回 404
    location / {
        return 404;
    }
}

